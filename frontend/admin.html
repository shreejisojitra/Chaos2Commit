<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — AI Solution Builder</title>
  <script src="/builder/config.js"></script>
  <script>/* Suppress Tailwind CDN dev warning */const _cw=console.warn;console.warn=(...a)=>{if(a[0]&&String(a[0]).includes("cdn.tailwindcss.com"))return;_cw(...a)};</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' } },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .sidebar-link.active { background: linear-gradient(135deg,rgba(37,99,235,.1),rgba(124,58,237,.08)); color:#2563eb; font-weight:600; }
    .sidebar-link:hover:not(.active) { background:#f8fafc; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
<div class="flex h-screen overflow-hidden">
  <aside class="hidden lg:flex lg:flex-col w-64 bg-white border-r border-slate-200 flex-shrink-0">
    <div class="h-16 flex items-center gap-2.5 px-5 border-b border-slate-100">
      <a href="index.html" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-600 to-violet-600 flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <span class="text-sm font-bold text-slate-900">AI Solution Builder</span>
      </a>
    </div>
    <nav class="flex-1 py-4 px-3 space-y-0.5">
      <a href="admin.html" class="sidebar-link active flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm">Admin</a>
      <a href="dashboard.html" class="sidebar-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-600">Dashboard</a>
      <a href="index.html" class="sidebar-link flex items-center gap-2.5 px-3 py-2 rounded-lg text-sm text-slate-600">Landing</a>
    </nav>
  </aside>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-4 sm:px-6 flex-shrink-0">
      <h1 class="text-lg font-semibold">Admin</h1>
      <div class="flex items-center gap-3">
        <span id="server-status" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-100 text-slate-500">Checking server…</span>
        <a href="dashboard.html" class="text-sm font-medium text-brand-600 hover:text-brand-700">Back to app</a>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">

      <!-- KPIs -->
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4" id="kpi-cards"></div>

      <!-- System info -->
      <div class="grid lg:grid-cols-3 gap-6">
        <section class="bg-white rounded-2xl border border-slate-200 shadow-soft p-5 space-y-3">
          <h2 class="text-sm font-semibold">Server</h2>
          <div id="server-info" class="space-y-2 text-sm text-slate-600"></div>
        </section>
        <section class="bg-white rounded-2xl border border-slate-200 shadow-soft p-5 space-y-3 lg:col-span-2">
          <h2 class="text-sm font-semibold">Generated App Config</h2>
          <div id="app-config" class="space-y-2 text-sm text-slate-600"></div>
        </section>
      </div>

      <!-- Projects + Versions -->
      <div class="grid lg:grid-cols-2 gap-6">
        <section class="bg-white rounded-2xl border border-slate-200 shadow-soft overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
            <h2 class="text-sm font-semibold">Projects (server-side)</h2>
            <span id="server-projects-count" class="text-xs text-slate-400"></span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-slate-50 text-xs text-slate-500 uppercase">
                <tr><th class="px-4 py-2 text-left">Name</th><th class="px-4 py-2 text-left">Status</th><th class="px-4 py-2 text-left">Updated</th></tr>
              </thead>
              <tbody id="server-projects-body"></tbody>
            </table>
          </div>
        </section>

        <section class="bg-white rounded-2xl border border-slate-200 shadow-soft overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-100">
            <h2 class="text-sm font-semibold">Changelog (last 10 versions)</h2>
          </div>
          <ul id="changelog-list" class="divide-y divide-slate-100 max-h-64 overflow-y-auto"></ul>
        </section>
      </div>

      <!-- Credit usage + Plans -->
      <div class="grid lg:grid-cols-2 gap-6">
        <section class="bg-white rounded-2xl border border-slate-200 shadow-soft overflow-hidden">
          <div class="px-5 py-4 border-b border-slate-100"><h2 class="text-sm font-semibold">Credit history (localStorage)</h2></div>
          <ul id="history-list" class="divide-y divide-slate-100 max-h-52 overflow-y-auto"></ul>
        </section>

        <section class="bg-white rounded-2xl border border-slate-200 shadow-soft p-5">
          <h2 class="text-sm font-semibold mb-4">Plans</h2>
          <div id="plans-cards" class="grid sm:grid-cols-2 gap-3"></div>
        </section>
      </div>

      <!-- Usage by action -->
      <section class="bg-white rounded-2xl border border-slate-200 shadow-soft p-5">
        <h2 class="text-sm font-semibold mb-4">Usage by action</h2>
        <div id="usage-cards" class="grid grid-cols-3 sm:grid-cols-6 gap-3"></div>
      </section>

    </main>
  </div>
</div>

<script>
const CREDIT_PLANS = {
  free:         { id:'free',         name:'Free',         credits:100,   priceMonthly:0   },
  starter:      { id:'starter',      name:'Starter',      credits:500,   priceMonthly:19  },
  professional: { id:'professional', name:'Professional', credits:2000,  priceMonthly:49  },
  business:     { id:'business',     name:'Business',     credits:10000, priceMonthly:149 },
};

function loadJSON(key, fb) { try { const r=localStorage.getItem(key); return r?JSON.parse(r):fb; } catch { return fb; } }
function esc(s) { return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function relTime(iso) {
  if (!iso) return '—';
  const sec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (sec < 60) return 'just now';
  if (sec < 3600) return Math.floor(sec/60) + 'm ago';
  if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
  return new Date(iso).toLocaleDateString();
}

async function render() {
  const billing = loadJSON('asb_billing', { planId:'free', creditsRemaining:100, creditsUsed:0, history:[] });
  const localProjects = loadJSON('asb_projects', []);
  const history = Array.isArray(billing.history) ? billing.history : [];

  // ── KPIs ──
  document.getElementById('kpi-cards').innerHTML = [
    { label:'Local projects', value: localProjects.length },
    { label:'Credits remaining', value: billing.creditsRemaining ?? 0 },
    { label:'Credits used', value: billing.creditsUsed ?? 0 },
    { label:'AI operations', value: history.length },
  ].map(k => `<div class="bg-white rounded-2xl border border-slate-200 shadow-soft p-4"><p class="text-xs font-medium text-slate-500">${k.label}</p><p class="text-2xl font-bold text-slate-900 mt-1">${k.value}</p></div>`).join('');

  // ── Server health ──
  try {
    const health = await fetch('/api/health').then(r=>r.json());
    document.getElementById('server-status').textContent = 'Server running';
    document.getElementById('server-status').className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-100 text-emerald-700';
    document.getElementById('server-info').innerHTML = `
      <div class="flex justify-between"><span class="text-slate-500">App name</span><span class="font-medium">${esc(health.app||'—')}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Version</span><span class="font-medium font-mono">${esc(health.version||'—')}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">AI configured</span><span class="font-medium ${health.aiConfigured?'text-emerald-600':'text-amber-600'}">${health.aiConfigured?'Yes ✓':'No — set OPENAI_API_KEY'}</span></div>
      <div class="flex justify-between"><span class="text-slate-500">Port</span><span class="font-medium">3847</span></div>`;
  } catch (_) {
    document.getElementById('server-status').textContent = 'Server offline';
    document.getElementById('server-status').className = 'text-xs font-semibold px-2.5 py-1 rounded-full bg-red-100 text-red-600';
    document.getElementById('server-info').innerHTML = '<p class="text-red-500 text-xs">Cannot reach server. Start: <code>cd generated-app && node server.js</code></p>';
  }

  // ── App config ──
  try {
    const cfg = await fetch('/api/config').then(r=>r.json());
    document.getElementById('app-config').innerHTML = `
      <div class="grid grid-cols-2 gap-x-6 gap-y-2">
        <div class="flex justify-between col-span-2 sm:col-span-1"><span class="text-slate-500">App name</span><span class="font-medium">${esc(cfg.appName||'—')}</span></div>
        <div class="flex justify-between col-span-2 sm:col-span-1"><span class="text-slate-500">Version</span><span class="font-mono font-medium">${esc(cfg.version||'—')}</span></div>
        <div class="flex justify-between col-span-2 sm:col-span-1"><span class="text-slate-500">Business</span><span class="font-medium">${esc(cfg.businessName||'—')}</span></div>
        <div class="flex justify-between col-span-2 sm:col-span-1"><span class="text-slate-500">Modules</span><span class="font-medium">${esc((cfg.modules||[]).join(', ')||'core only')}</span></div>
      </div>
      <a href="/" target="_blank" class="inline-flex items-center gap-1.5 text-xs font-semibold text-brand-600 hover:text-brand-700 mt-1">Open generated app ↗</a>`;
  } catch (_) {
    document.getElementById('app-config').innerHTML = '<p class="text-slate-400 text-xs">Server not responding.</p>';
  }

  // ── Server projects ──
  try {
    const serverProjects = await fetch('/api/projects').then(r=>r.json());
    document.getElementById('server-projects-count').textContent = serverProjects.length + ' on server';
    document.getElementById('server-projects-body').innerHTML = serverProjects.slice(0,15).map(p => `
      <tr class="border-t border-slate-100 hover:bg-slate-50">
        <td class="px-4 py-2.5 font-medium"><a href="project.html?id=${encodeURIComponent(p.id)}" class="text-brand-600 hover:underline">${esc(p.name||'Untitled')}</a></td>
        <td class="px-4 py-2.5 text-slate-500">${esc(p.status||'draft')}</td>
        <td class="px-4 py-2.5 text-slate-400 text-xs">${relTime(p.updatedAt||p.createdAt)}</td>
      </tr>`).join('') || '<tr><td colspan="3" class="px-4 py-6 text-center text-slate-400 text-sm">No projects on server yet</td></tr>';
  } catch(_) {
    document.getElementById('server-projects-body').innerHTML = '<tr><td colspan="3" class="px-4 py-4 text-slate-400 text-sm">Server not available</td></tr>';
  }

  // ── Changelog ──
  try {
    const changelog = await fetch('/api/versions').then(r=>r.json());
    document.getElementById('changelog-list').innerHTML = changelog.slice(0,10).map(e => `
      <li class="px-5 py-3 flex justify-between gap-3 text-sm">
        <div>
          <span class="font-semibold text-slate-900">v${esc(e.version||'?')}</span>
          <span class="ml-2 text-xs text-slate-500">${esc(e.action||'change')}</span>
          <p class="text-xs text-slate-400 mt-0.5">${esc(e.spec?.appName||e.plan?.summary||e.title||'')}</p>
        </div>
        <span class="text-xs text-slate-400 flex-shrink-0">${relTime(e.at)}</span>
      </li>`).join('') || '<li class="px-5 py-6 text-center text-slate-400 text-sm">No versions yet</li>';
  } catch(_) {
    document.getElementById('changelog-list').innerHTML = '<li class="px-5 py-4 text-sm text-slate-400">Server not available</li>';
  }

  // ── Credit history ──
  document.getElementById('history-list').innerHTML = history.slice(0, 30).map(h =>
    `<li class="px-5 py-2.5 flex justify-between gap-3 text-sm">
      <span class="text-slate-700">${esc(h.action||'action')}<span class="text-slate-400 text-xs ml-2">${esc(h.projectName||'')}</span></span>
      <span class="text-slate-400">−${h.credits||0} · ${relTime(h.at)}</span>
    </li>`).join('') || '<li class="px-5 py-6 text-center text-slate-400 text-sm">No history</li>';

  // ── Usage by action ──
  const usage = {};
  history.forEach(h => { const k=(h.action||'other'); usage[k]=(usage[k]||0)+(h.credits||0); });
  const allActions = ['consultant','blueprint','architecture','generate','modify','document'];
  document.getElementById('usage-cards').innerHTML = allActions.map(k =>
    `<div class="rounded-xl border border-slate-100 bg-slate-50/80 p-3 text-center">
      <p class="text-xs text-slate-500 capitalize">${esc(k)}</p>
      <p class="text-lg font-bold mt-0.5">${usage[k]||0}</p>
    </div>`).join('');

  // ── Plans ──
  document.getElementById('plans-cards').innerHTML = Object.values(CREDIT_PLANS).map(pl => {
    const active = billing.planId === pl.id;
    return `<div class="rounded-xl border ${active?'border-brand-300 ring-2 ring-brand-100':'border-slate-200'} p-3">
      <div class="flex justify-between items-start"><h3 class="text-sm font-semibold">${esc(pl.name)}</h3>${active?'<span class="text-xs font-semibold text-brand-600">Current</span>':''}</div>
      <p class="text-xl font-bold mt-1">${pl.priceMonthly?'$'+pl.priceMonthly:'Free'}<span class="text-xs font-normal text-slate-400">${pl.priceMonthly?'/mo':''}</span></p>
      <p class="text-xs text-slate-500 mt-1">${pl.credits.toLocaleString()} credits</p>
    </div>`;
  }).join('');
}

render();
</script>
</body>
</html>

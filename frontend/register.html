<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account — AI Solution Builder</title>
  <script src="/builder/config.js"></script>
  <script>/* Suppress Tailwind CDN dev warning */const _cw=console.warn;console.warn=(...a)=>{if(a[0]&&String(a[0]).includes("cdn.tailwindcss.com"))return;_cw(...a)};</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{brand:{50:'#eff6ff',100:'#dbeafe',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}}</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>body { font-family: Inter, system-ui, sans-serif; } .gradient-bg { background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(37,99,235,0.15), transparent); }</style>
</head>
<body class="min-h-screen bg-slate-50 gradient-bg flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="/builder/index.html" class="inline-flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand-600 to-violet-600 flex items-center justify-center shadow-lg">
          <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <span class="text-xl font-bold text-slate-900">AI Solution Builder</span>
      </a>
      <p class="mt-2 text-sm text-slate-500">Start building for free — no credit card needed</p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-8">
      <h1 class="text-xl font-bold text-slate-900 mb-2">Create your account</h1>
      <p class="text-sm text-slate-500 mb-6">Free plan includes 100 credits to get started.</p>

      <div id="error-banner" class="hidden mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-sm text-red-700"></div>

      <form id="reg-form" class="space-y-4">
        <label class="block">
          <span class="text-sm font-medium text-slate-700">Full name</span>
          <input type="text" id="name" required autocomplete="name"
            class="mt-1.5 w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:border-brand-400 focus:ring-2 focus:ring-brand-100 outline-none"
            placeholder="Rahul Shah" />
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-700">Email</span>
          <input type="email" id="email" required autocomplete="username"
            class="mt-1.5 w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:border-brand-400 focus:ring-2 focus:ring-brand-100 outline-none"
            placeholder="you@example.com" />
        </label>
        <label class="block">
          <span class="text-sm font-medium text-slate-700">Password</span>
          <input type="password" id="password" required autocomplete="new-password" minlength="6"
            class="mt-1.5 w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:border-brand-400 focus:ring-2 focus:ring-brand-100 outline-none"
            placeholder="Min. 6 characters" />
        </label>

        <!-- Plan preview -->
        <div class="bg-brand-50 rounded-xl p-3 flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center flex-shrink-0">
            <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>
          </div>
          <div>
            <p class="text-sm font-semibold text-brand-900">Free plan — 100 credits</p>
            <p class="text-xs text-brand-700">~4 full app generations included</p>
          </div>
        </div>

        <button type="submit" id="btn-reg"
          class="w-full py-2.5 text-sm font-semibold text-white bg-brand-600 rounded-xl hover:bg-brand-700 transition-colors">
          Create free account
        </button>
      </form>

      <div class="mt-4 text-center text-sm text-slate-500">
        Already have an account?
        <a href="/builder/login.html" class="text-brand-600 font-medium hover:text-brand-700">Sign in</a>
      </div>
    </div>
    <p class="text-center text-xs text-slate-400 mt-6"><a href="/" class="hover:text-slate-600">← Back to home</a></p>
  </div>

  <script>
    const API = window.ASB_API || '';

    document.getElementById('reg-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-reg');
      const err = document.getElementById('error-banner');
      err.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Creating account…';
      try {
        const res = await fetch(API + '/api/builder/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) { err.textContent = data.error || 'Registration failed'; err.classList.remove('hidden'); return; }
        location.href = '/builder/dashboard.html';
      } catch (_) {
        err.textContent = 'Could not reach server. Is it running?';
        err.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create free account';
      }
    });
  </script>
</body>
</html>

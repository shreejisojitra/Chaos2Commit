<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Records — Generated App</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">Generated App</div>
      <a href="/" class="active">Records</a>
      <a href="/attendance.html">Attendance</a>
      <a href="#" id="logout-link">Logout</a>
    </aside>
    <div class="main">
      <header class="topbar">
        <h2>Records</h2>
        <div class="toolbar">
          <span class="muted small" id="user-label"></span>
          <button class="btn btn-primary" id="btn-new">New Record</button>
        </div>
      </header>
      <div class="content">
        <div class="stats" id="stats"></div>
        <div class="panel">
          <div class="panel-header">
            <strong>All records</strong>
            <div class="toolbar">
              <input type="search" id="filter" placeholder="Filter by title…" />
              <select id="status-filter">
                <option value="">All statuses</option>
                <option value="open">Open</option>
                <option value="in_progress">In progress</option>
                <option value="done">Done</option>
                <option value="archived">Archived</option>
              </select>
            </div>
          </div>
          <div class="panel-body">
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Status</th>
                  <th>Updated</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal">
      <h3 id="modal-title">New record</h3>
      <div id="modal-error" class="error" hidden></div>
      <form id="form">
        <input type="hidden" id="record-id" />
        <label>Title
          <input type="text" id="title" required />
        </label>
        <label>Description
          <textarea id="description" rows="3"></textarea>
        </label>
        <label>Status
          <select id="status">
            <option value="open">Open</option>
            <option value="in_progress">In progress</option>
            <option value="done">Done</option>
            <option value="archived">Archived</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function api(method, path, body) {
      const opts = { method, headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin' };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || res.statusText);
      return data;
    }

    let records = [];

    function badge(status) {
      return '<span class="badge badge-' + status + '">' + status.replace('_', ' ') + '</span>';
    }

    function render() {
      const q = (document.getElementById('filter').value || '').toLowerCase();
      const st = document.getElementById('status-filter').value;
      let rows = records.slice();
      if (q) rows = rows.filter(r => (r.title || '').toLowerCase().includes(q));
      if (st) rows = rows.filter(r => r.status === st);
      const tbody = document.getElementById('rows');
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><strong>${esc(r.title)}</strong><div class="muted small">${esc(r.description || '')}</div></td>
          <td>${badge(r.status)}</td>
          <td class="small muted">${esc((r.updated_at || r.created_at || '').slice(0, 19).replace('T', ' '))}</td>
          <td>
            <button class="btn btn-ghost" data-edit="${r.id}">Edit</button>
            <button class="btn btn-danger" data-del="${r.id}">Delete</button>
          </td>
        </tr>`).join('') || '<tr><td colspan="4" class="muted center">No records yet</td></tr>';

      const counts = { open: 0, in_progress: 0, done: 0, archived: 0 };
      records.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
      document.getElementById('stats').innerHTML = Object.entries(counts).map(([k, v]) =>
        `<div class="stat"><div class="label">${k.replace('_',' ')}</div><div class="value">${v}</div></div>`).join('');
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function load() {
      try {
        const me = await api('GET', '/api/auth/me');
        document.getElementById('user-label').textContent = me.name + ' (' + me.role + ')';
        records = await api('GET', '/api/records');
        render();
      } catch (e) {
        window.location.href = '/login.html';
      }
    }

    document.getElementById('filter').addEventListener('input', render);
    document.getElementById('status-filter').addEventListener('change', render);

    document.getElementById('btn-new').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'New record';
      document.getElementById('record-id').value = '';
      document.getElementById('title').value = '';
      document.getElementById('description').value = '';
      document.getElementById('status').value = 'open';
      document.getElementById('modal-error').hidden = true;
      document.getElementById('modal').hidden = false;
    });

    document.getElementById('btn-cancel').addEventListener('click', () => {
      document.getElementById('modal').hidden = true;
    });

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('record-id').value;
      const body = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        status: document.getElementById('status').value,
      };
      try {
        if (id) await api('PUT', '/api/records/' + id, body);
        else await api('POST', '/api/records', body);
        document.getElementById('modal').hidden = true;
        await load();
      } catch (err) {
        const el = document.getElementById('modal-error');
        el.textContent = err.message;
        el.hidden = false;
      }
    });

    document.getElementById('rows').addEventListener('click', async (e) => {
      const edit = e.target.getAttribute('data-edit');
      const del = e.target.getAttribute('data-del');
      if (edit) {
        const r = records.find(x => String(x.id) === edit);
        if (!r) return;
        document.getElementById('modal-title').textContent = 'Edit record';
        document.getElementById('record-id').value = r.id;
        document.getElementById('title').value = r.title || '';
        document.getElementById('description').value = r.description || '';
        document.getElementById('status').value = r.status || 'open';
        document.getElementById('modal-error').hidden = true;
        document.getElementById('modal').hidden = false;
      }
      if (del && confirm('Delete this record?')) {
        try {
          await api('DELETE', '/api/records/' + del);
          await load();
        } catch (err) { alert(err.message); }
      }
    });

    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      await api('POST', '/api/auth/logout');
      window.location.href = '/login.html';
    });

    load();
  </script>
</body>
</html>

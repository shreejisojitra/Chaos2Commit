<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders — PaniPuriExpress</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">PaniPuriExpress</div>
    <a href="/" class="active">Orders</a>
    
    <a href="#" id="logout-link">Logout</a>
  </aside>
  <div class="main">
    <header class="topbar">
      <h2>Orders</h2>
      <div class="toolbar">
        <span class="muted small" id="user-label"></span>
        <button class="btn btn-primary" id="btn-new">New Order</button>
      </div>
    </header>
    <div class="content">
      <div class="stats" id="stats"></div>
      <div class="panel">
        <div class="panel-header">
          <strong>All orders</strong>
          <div class="toolbar">
            <input type="search" id="filter" placeholder="Search…" />
            <select id="status-filter">
              <option value="">All statuses</option>
              <option value="open">Open</option>
              <option value="in_progress">In progress</option>
              <option value="done">Done</option>
              <option value="archived">Archived</option>
            </select>
          </div>
        </div>
        <div class="panel-body">
          <table>
            <thead><tr><th>Title</th><th>User id</th><th>Items</th><th>Total amount</th><th>Delivery partner id</th><th>Status</th><th>Updated</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="modal" hidden>
  <div class="modal">
    <h3 id="modal-title">New Order</h3>
    <div id="modal-error" class="error" hidden></div>
    <form id="form">
      <input type="hidden" id="record-id" />
      <label>Title<input type="text" id="field-title" required /></label>
      <label>User id
        <input type="text" id="field-user_id" name="user_id" required />
      </label>
<label>Items
        <input type="text" id="field-items" name="items" required />
      </label>
<label>Total amount
        <input type="text" id="field-total_amount" name="total_amount" required />
      </label>
<label>Delivery partner id
        <input type="text" id="field-delivery_partner_id" name="delivery_partner_id"  />
      </label>
      <label>Status
        <select id="field-status">
          <option value="open">Open</option>
          <option value="in_progress">In progress</option>
          <option value="done">Done</option>
          <option value="archived">Archived</option>
        </select>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>
<script>
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  async function api(method,path,body){ const o={method,headers:{'Content-Type':'application/json'},credentials:'same-origin'}; if(body)o.body=JSON.stringify(body); const r=await fetch(path,o); const d=await r.json().catch(()=>({})); if(!r.ok)throw new Error(d.error||r.statusText); return d; }
  let records=[];
  function badge(s){ return '<span class="badge badge-'+s+'">'+s.replace('_',' ')+'</span>'; }
  function render(){
    const q=(document.getElementById('filter').value||'').toLowerCase();
    const st=document.getElementById('status-filter').value;
    let rows=records.slice();
    if(q)rows=rows.filter(r=>(r.title||'').toLowerCase().includes(q));
    if(st)rows=rows.filter(r=>r.status===st);
    document.getElementById('rows').innerHTML=rows.map(r=>`<tr>
      <td><strong>${esc(r.title)}</strong><div class="muted small">${esc(r.description||'')}</div></td>
      <td>${esc(String(r.user_id ?? '—'))}</td><td>${esc(String(r.items ?? '—'))}</td><td>${esc(String(r.total_amount ?? '—'))}</td><td>${esc(String(r.delivery_partner_id ?? '—'))}</td>
      <td>${badge(r.status)}</td>
      <td class="small muted">${esc((r.updated_at||'').slice(0,19).replace('T',' '))}</td>
      <td><button class="btn btn-ghost" data-edit="${r.id}">Edit</button> <button class="btn btn-danger" data-del="${r.id}">Delete</button></td>
    </tr>`).join('')||'<tr><td colspan="6" class="muted center">No orders yet</td></tr>';
    const counts={open:0,in_progress:0,done:0,archived:0};
    records.forEach(r=>{ if(counts[r.status]!==undefined)counts[r.status]++; });
    document.getElementById('stats').innerHTML=Object.entries(counts).map(([k,v])=>`<div class="stat"><div class="label">${k.replace('_',' ')}</div><div class="value">${v}</div></div>`).join('');
  }
  async function load(){
    try{
      const me=await api('GET','/api/auth/me');
      document.getElementById('user-label').textContent=me.name+' ('+me.role+')';
      records=await api('GET','/api/records');
      render();
    } catch(e){ window.location.href='/login.html'; }
  }
  document.getElementById('filter').addEventListener('input',render);
  document.getElementById('status-filter').addEventListener('change',render);
  document.getElementById('btn-new').addEventListener('click',()=>{
    document.getElementById('modal-title').textContent='New Order';
    document.getElementById('record-id').value='';
    document.getElementById('form').reset();
    document.getElementById('modal-error').hidden=true;
    document.getElementById('modal').hidden=false;
  });
  document.getElementById('btn-cancel').addEventListener('click',()=>{ document.getElementById('modal').hidden=true; });
  document.getElementById('form').addEventListener('submit',async(e)=>{
    e.preventDefault();
    const id=document.getElementById('record-id').value;
    const body={ title:document.getElementById('field-title').value, user_id: document.getElementById('field-user_id').value, items: document.getElementById('field-items').value, total_amount: document.getElementById('field-total_amount').value, delivery_partner_id: document.getElementById('field-delivery_partner_id').value, status:document.getElementById('field-status').value };
    try{
      if(id) await api('PUT','/api/records/'+id,body);
      else await api('POST','/api/records',body);
      document.getElementById('modal').hidden=true;
      await load();
    }catch(err){ const el=document.getElementById('modal-error'); el.textContent=err.message; el.hidden=false; }
  });
  document.getElementById('rows').addEventListener('click',async(e)=>{
    const edit=e.target.getAttribute('data-edit');
    const del=e.target.getAttribute('data-del');
    if(edit){
      const r=records.find(x=>String(x.id)===edit); if(!r)return;
      document.getElementById('modal-title').textContent='Edit Order';
      document.getElementById('record-id').value=r.id;
      document.getElementById('field-title').value=r.title||'';
      document.getElementById('field-user_id').value = r.user_id || ''; document.getElementById('field-items').value = r.items || ''; document.getElementById('field-total_amount').value = r.total_amount || ''; document.getElementById('field-delivery_partner_id').value = r.delivery_partner_id || '';
      document.getElementById('field-status').value=r.status||'open';
      document.getElementById('modal-error').hidden=true;
      document.getElementById('modal').hidden=false;
    }
    if(del&&confirm('Delete this order?')){
      try{ await api('DELETE','/api/records/'+del); await load(); }catch(err){ alert(err.message); }
    }
  });
  document.getElementById('logout-link').addEventListener('click',async(e)=>{
    e.preventDefault(); await api('POST','/api/auth/logout'); window.location.href='/login.html';
  });
  load();
</script>
</body>
</html>

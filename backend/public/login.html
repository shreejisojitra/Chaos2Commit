<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo-mark"></div>
      <h1 id="app-title">Application</h1>
      <p id="app-business" class="muted"></p>
    </div>
    <form id="login-form">
      <label>
        Email
        <input type="email" id="email" name="email" required autocomplete="username" value="admin@example.com" />
      </label>
      <label>
        Password
        <input type="password" id="password" name="password" required autocomplete="current-password" value="admin123" />
      </label>
      <p id="error" class="error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
    <p class="muted small center">Demo: admin@example.com / admin123</p>
    <p class="muted small center"><a href="/register.html">Create an account</a></p>
  </div>
  <script>
    fetch('/api/config').then(r => r.json()).then(c => {
      document.getElementById('app-title').textContent = c.appName || 'Application';
      document.getElementById('app-business').textContent = c.businessName || '';
      document.title = 'Sign in — ' + (c.appName || 'App');
    }).catch(() => {});

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.hidden = true;
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        error.textContent = data.error || 'Login failed';
        error.hidden = false;
        return;
      }
      window.location.href = '/';
    });
  </script>
</body>
</html>
